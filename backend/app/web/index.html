<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>capypilot connect</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg:#0d0f12; --panel:#16191f; --line:#272b33; --fg:#e6e9ef; --muted:#8b93a1; --accent:#4ea1ff; --ok:#39d98a; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
    header { display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel); }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    header .sp { flex:1; }
    .layout { display:grid; grid-template-columns: 260px 320px 1fr; height:calc(100vh - 49px); }
    .col { border-right:1px solid var(--line); overflow-y:auto; }
    .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:12px 14px 6px; margin:0; }
    .item { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
    .item:hover { background:#1c2027; }
    .item.active { background:#1f2733; border-left:3px solid var(--accent); }
    .item .sub { color:var(--muted); font-size:12px; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:#555; }
    .dot.online { background:var(--ok); box-shadow:0 0 6px var(--ok); }
    #map { height:55%; }
    .detail { padding:14px; }
    .detail .meta { color:var(--muted); font-size:12px; margin-bottom:8px; }
    video { width:100%; background:#000; border:1px solid var(--line); border-radius:6px; }
    button { background:var(--accent); color:#04121f; border:0; padding:7px 12px; border-radius:6px; font-weight:600; cursor:pointer; }
    button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
    .login { max-width:320px; margin:12vh auto; background:var(--panel); padding:24px; border:1px solid var(--line); border-radius:10px; }
    .login input { width:100%; padding:9px; margin:6px 0; background:#0d0f12; border:1px solid var(--line); color:var(--fg); border-radius:6px; }
    .err { color:#ff6b6b; font-size:13px; min-height:18px; }
    code { background:#0d0f12; padding:1px 5px; border-radius:4px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
