[project]
name = "capypilot-backend"
version = "0.1.0"
description = "Self-hosted backend for capypilot: device registration, data upload, log indexing, and a connect-style web UI"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
